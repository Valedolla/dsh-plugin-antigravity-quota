name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test-windows:
    name: Windows Test Suite (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '20', '22' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify PowerShell scripts syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path bin/*.ps1
          foreach ($s in $scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "Syntax error in $($s.Name): $($errors | Out-String)"
            }
          }

      - name: Run unit & integration tests
        run: npm test

  release:
    name: Build & Publish Release
    needs: test-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package release artifacts (.zip, .tgz, SHA256)
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkg = Get-Content ./package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $tagVersion) {
            throw "Tag version ($tagVersion) does not match package.json version ($($pkg.version))"
          }

          New-Item -ItemType Directory -Path ./dist/dsh-plugin-antigravity-quota -Force | Out-Null
          $include = @('lib', 'bin', 'locale', 'cordis.patch.yml', 'package.json', 'README.md', 'install.bat', 'LICENSE')
          foreach ($item in $include) {
            if (Test-Path $item) {
              Copy-Item -Path $item -Destination ./dist/dsh-plugin-antigravity-quota -Recurse -Force
            }
          }

          $zipName = "dsh-plugin-antigravity-quota-$tagVersion.zip"
          Compress-Archive -Path ./dist/dsh-plugin-antigravity-quota/* -DestinationPath "./$zipName" -Force

          npm pack
          $tgzName = "dsh-plugin-antigravity-quota-$tagVersion.tgz"

          $hashes = @()
          foreach ($file in @($zipName, $tgzName)) {
            $h = (Get-FileHash "./$file" -Algorithm SHA256).Hash.ToLower()
            $hashes += "$h  $file"
          }
          $hashes -join "`n" | Set-Content -Path ./SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-plugin-antigravity-quota-*.zip
            dsh-plugin-antigravity-quota-*.tgz
            SHA256SUMS.txt
